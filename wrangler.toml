# Public, portable configuration. No personal domains, email addresses or secrets.
# Replace database_id after running: npx wrangler d1 create noteflare
name = "noteflare"
main = "server/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# This ONLY enables bypass on localhost/127.0.0.1; public hosts always require Access.
ALLOW_LOCAL_ADMIN = "true"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "noteflare"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "noteflare-attachments"

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 180
period = 60

[triggers]
# Daily at 03:15 Asia/Shanghai (19:15 UTC).
crons = ["15 19 * * *"]
